# Loaded in nginx's http context. This file is rendered by the official image.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Avoid logging query strings containing unsubscribe tokens or personal data.
log_format edge '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
access_log /var/log/nginx/access.log edge;
server_tokens off;
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    location = /edge-health { access_log off; return 200 'ok'; }
    location / { return 444; }
}
server {
    listen 80;
    server_name itrix.co.kr www.itrix.co.kr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://itrix.co.kr$request_uri; }
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name www.itrix.co.kr;
    ssl_certificate /etc/letsencrypt/live/itrix.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itrix.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://itrix.co.kr$request_uri;
}
server {
    listen 443 ssl;
    server_name itrix.co.kr;
    ssl_certificate /etc/letsencrypt/live/itrix.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itrix.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 25m;
    location / {
        set $railway_host ${RAILWAY_WEB_HOST};
        # Explicit URI retains every path and query, including admin and Next assets.
        proxy_pass https://$railway_host$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $railway_host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the first public proxy: discard client-supplied forwarding chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_name $railway_host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect https://$railway_host/ https://itrix.co.kr/;
    }
}
